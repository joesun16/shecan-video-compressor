name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install PyQt6 pyinstaller

    - name: Download FFmpeg
      run: |
        Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
        Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_temp"
        New-Item -ItemType Directory -Force -Path "ffmpeg"
        $nested = Get-ChildItem -Path "ffmpeg_temp" -Directory | Select-Object -First 1
        Copy-Item -Path "$($nested.FullName)\bin\ffmpeg.exe" -Destination "ffmpeg\"
        Copy-Item -Path "$($nested.FullName)\bin\ffprobe.exe" -Destination "ffmpeg\"
        Remove-Item -Recurse -Force "ffmpeg_temp", "ffmpeg.zip"
        .\ffmpeg\ffmpeg.exe -version
        .\ffmpeg\ffprobe.exe -version

    - name: Build with PyInstaller
      run: |
        pyinstaller --name="EllaPuede视频压缩工具" --windowed --onedir --noconfirm --clean --icon=icon.ico --add-data "ffmpeg;ffmpeg" video_compressor.py

    - name: Ensure FFmpeg accessible
      run: |
        # PyInstaller --add-data puts files in _internal/ffmpeg/ for onedir mode
        # But app code looks in _MEIPASS/ffmpeg/ which equals _internal/ffmpeg/
        # Also copy to app root as fallback
        if (!(Test-Path "dist\EllaPuede视频压缩工具\ffmpeg\ffmpeg.exe")) {
          Copy-Item -Path "ffmpeg" -Destination "dist\EllaPuede视频压缩工具\ffmpeg" -Recurse
        }
        # Verify FFmpeg works from bundled location
        $exe = (Get-ChildItem -Path "dist\EllaPuede视频压缩工具" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1).FullName
        & $exe -version
        if ($LASTEXITCODE -ne 0) { throw "Bundled FFmpeg broken" }

    - name: Smoke test (Windows)
      run: |
        $app = "dist\EllaPuede视频压缩工具\EllaPuede视频压缩工具.exe"
        $proc = Start-Process -FilePath $app -PassThru
        Start-Sleep -Seconds 8
        if ($proc.HasExited) {
          Write-Error "App crashed on launch (exit code: $($proc.ExitCode))"
          exit 1
        }
        Stop-Process -Id $proc.Id -Force
        Write-Host "Smoke test passed"

    - name: Build Installer
      uses: Minionguyjpro/Inno-Setup-Action@v1.2.4
      with:
        path: installer.iss

    - name: Upload Windows Installer
      uses: actions/upload-artifact@v4
      with:
        name: Windows-Installer
        path: installer_output/*.exe

    - name: Upload Windows Portable
      uses: actions/upload-artifact@v4
      with:
        name: Windows-Portable
        path: dist/EllaPuede视频压缩工具/

  build-macos:
    runs-on: macos-14
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install PyQt6 pyinstaller

    - name: Download FFmpeg
      run: |
        mkdir -p ffmpeg
        curl -L "https://evermeet.cx/ffmpeg/getrelease/zip" -o ffmpeg.zip
        unzip ffmpeg.zip -d ffmpeg/
        curl -L "https://evermeet.cx/ffmpeg/getrelease/ffprobe/zip" -o ffprobe.zip
        unzip ffprobe.zip -d ffmpeg/
        chmod +x ffmpeg/ffmpeg ffmpeg/ffprobe
        rm -f ffmpeg.zip ffprobe.zip
        ./ffmpeg/ffmpeg -version | head -1
        ./ffmpeg/ffprobe -version | head -1

    - name: Build with PyInstaller
      run: |
        pyinstaller \
          --name="EllaPuede视频压缩工具" \
          --windowed \
          --onedir \
          --noconfirm \
          --clean \
          --icon=icon.icns \
          --osx-bundle-identifier=com.ellapuede.videocompressor \
          video_compressor.py

    - name: Bundle FFmpeg and fix Info.plist
      run: |
        APP="dist/EllaPuede视频压缩工具.app"
        if [ ! -d "$APP" ]; then
          echo "ERROR: .app not created"
          ls -la dist/
          exit 1
        fi

        # Bundle FFmpeg into Resources
        cp -r ffmpeg "$APP/Contents/Resources/"
        ls -la "$APP/Contents/Resources/ffmpeg/"

        # Fix Info.plist (PyInstaller generates incomplete one)
        PLIST="$APP/Contents/Info.plist"
        /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string 3.0" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 3.0" "$PLIST"
        /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string 3.0" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 3.0" "$PLIST"
        /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string EllaPuede视频压缩工具" "$PLIST" 2>/dev/null || true
        /usr/libexec/PlistBuddy -c "Add :NSHighResolutionCapable bool true" "$PLIST" 2>/dev/null || true

        # Re-sign after modifications
        codesign --force --deep --sign - "$APP"

    - name: Smoke test (macOS)
      run: |
        APP="dist/EllaPuede视频压缩工具.app/Contents/MacOS/EllaPuede视频压缩工具"
        "$APP" &
        APP_PID=$!
        sleep 8
        if kill -0 $APP_PID 2>/dev/null; then
          echo "App launched successfully (PID $APP_PID)"
          kill $APP_PID
          wait 2>/dev/null || true
        else
          echo "App crashed on launch"
          # Show last crash report if any
          ls -la ~/Library/Logs/DiagnosticReports/ 2>/dev/null | tail -5 || true
          exit 1
        fi

    - name: Create DMG
      run: |
        mkdir -p dmg_contents
        cp -R "dist/EllaPuede视频压缩工具.app" dmg_contents/
        ln -s /Applications dmg_contents/Applications
        hdiutil create -volname "EllaPuede视频压缩工具" -srcfolder dmg_contents -ov -format UDZO "EllaPuede视频压缩工具_macOS.dmg"
        ls -lh "EllaPuede视频压缩工具_macOS.dmg"

    - name: Upload macOS DMG
      uses: actions/upload-artifact@v4
      with:
        name: macOS-DMG
        path: "*.dmg"

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
    - name: Download Windows Installer
      uses: actions/download-artifact@v4
      with:
        name: Windows-Installer
        path: ./release

    - name: Download macOS DMG
      uses: actions/download-artifact@v4
      with:
        name: macOS-DMG
        path: ./release

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: ./release/*
        body: |
          ## EllaPuede 视频压缩工具 V3.1

          两个平台的安装包均通过 CI 自动启动测试（smoke test）验证。

          ### 下载
          - **Windows**: 下载 `EllaPuede视频压缩工具_Setup.exe`，双击安装
          - **macOS**: 下载 `EllaPuede视频压缩工具_macOS.dmg`，打开后将图标拖到 Applications

          FFmpeg 已内置，安装即用。

          ### V3 更新内容
          - 品牌更名：SheCan → EllaPuede
          - 并行压缩、极致压缩档位、360p 分辨率
          - 智能音频（低码率 AAC 自动跳过重编码）
          - 动态码率（GPU 编码按分辨率计算）
          - 内置参数指南、即时语言切换
          - 右键菜单 + Delete 键删除
